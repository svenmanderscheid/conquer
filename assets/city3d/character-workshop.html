<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conquer · Figurenwerkstatt</title>
<link rel="stylesheet" href="../css/fantasy-fonts.css"><link rel="stylesheet" href="../css/village-theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ui-paper);color:var(--ui-ink);font-family:var(--ui-font)}header{padding:18px max(20px,env(safe-area-inset-left));background:var(--ui-primary);color:var(--ui-card);border-bottom:3px solid var(--ui-gold)}h1{font-size:25px;margin:0}header p{margin:5px 0 0}main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;max-width:1120px;margin:auto;padding:20px}#stage{height:560px;min-width:0;background:var(--ui-card);border:2px solid var(--ui-line);border-radius:20px;overflow:hidden;touch-action:pan-y;cursor:grab}canvas{display:block;width:100%;height:100%}aside{display:flex;flex-direction:column;gap:14px}fieldset{border:1px solid var(--ui-line);border-radius:12px;padding:12px}legend{padding:0 5px}button,select{font:inherit;min-height:44px;border:1px solid var(--ui-frame);border-radius:9px;background:var(--ui-card);color:var(--ui-ink);padding:8px 12px}select{width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible,#stage:focus-visible{outline:3px solid var(--ui-primary-light);outline-offset:3px}#reference{width:100%;max-height:190px;object-fit:contain;border-radius:12px}label{display:block;margin:5px 0}.actions{display:grid;gap:8px}small{line-height:1.45}#metrics{font-family:var(--ui-font-number);font-size:13px}footer{padding:0 20px 20px;text-align:center}a{color:var(--ui-primary)}@media(max-width:650px){main{grid-template-columns:1fr;padding:12px;gap:12px}#stage{height:380px}aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}#reference{max-height:150px}header{padding:12px}h1{font-size:22px}}@media(max-height:480px) and (orientation:landscape){main{grid-template-columns:minmax(0,1fr) 260px;padding:10px}#stage{height:290px}header p{display:none}aside{display:flex}#reference{display:none}}
</style></head><body><header><h1>Figurenwerkstatt</h1><p>Eine Familie · gemeinsame Bewegungen · Conquers gezeichnete Fantasywelt</p></header>
<main><div id="stage" tabindex="0" role="img" aria-label="Animierte 3D-Figur. Horizontal ziehen oder Pfeiltasten zum Drehen."></div><aside>
<fieldset><legend>Figur</legend><label for="role">Rolle</label><select id="role"><option value="infantry">Infanterist</option><option value="guard">Stadtwache</option><option value="worker">Arbeiter</option><option value="citizen">Bewohner</option></select></fieldset>
<fieldset><legend>Bewegung</legend><label for="motion">Animation</label><select id="motion"><option value="idle">Bereitstehen</option><option value="walk">Gehen</option><option value="attack">Angreifen</option><option value="work">Arbeiten</option></select><label><input type="checkbox" id="pause"> Bewegung pausieren</label></fieldset>
<img id="reference" src="../art/knight.png" alt="Originale 2D-Stilvorlage des Conquer-Ritters">
<div class="actions"><button id="reset">Ansicht zurücksetzen</button><button id="export">3D-Modell herunterladen</button><small>GLB mit Skelett und vier Animationen. Die Toon-Darstellung wird in Conquer ergänzt.</small><output id="metrics" aria-live="polite"></output></div>
</aside></main><footer>Ziehen zum Drehen · <a href="../../city#city">Zur Stadt</a></footer>
<script type="module" src="./character-workshop.js?v=infantry2"></script></body></html>
