<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conquer – Sammelanimationen</title>
<link rel="stylesheet" href="../css/fantasy-fonts.css">
<link rel="stylesheet" href="../css/village-theme.css">
<style>
body{margin:0;padding:20px;background:var(--ui-paper);color:var(--ui-ink);font-family:var(--ui-font)}
main{max-width:1100px;margin:auto}h1{margin:0 0 8px}p{margin:8px 0 16px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
button{min-height:44px;padding:8px 18px;border:2px solid var(--ui-frame);border-radius:9px;background:var(--ui-card);color:var(--ui-ink);font:inherit}
button[aria-pressed=true]{background:var(--ui-primary);color:var(--ui-card)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}article{background:var(--ui-card);border:2px solid var(--ui-line);border-radius:16px;overflow:hidden;text-align:center}
h2{margin:0;padding:10px;background:var(--ui-primary);color:var(--ui-card);font-size:20px}.stage{height:220px;position:relative;background:#b9c985 url('../art/fantasy-village-v1/world-tile-0.png') center/540px}
.marker{position:absolute;left:50%;bottom:34px;width:0;height:0;--tile-size:88px}.marker>img,.marker>canvas{position:absolute;left:0;pointer-events:none}.status{font-size:16px;color:var(--ui-blue-dark);padding:8px}
@media(max-width:440px){body{padding:12px}.gallery{grid-template-columns:1fr 1fr;gap:8px}.stage{height:180px}.marker{--tile-size:70px}h2{font-size:18px}}
</style>
<main><h1>Arbeit an den Rohstoffstellen</h1><p>Die echten Kartenanimationen im Überblick. Diese Vorschau verändert keinen Spielstand.</p>
<div class="controls"><button id="work" aria-pressed="true">Sammelt</button><button id="motion" aria-pressed="false">Bewegung reduzieren</button><a href="../../city#world">Zur Weltkarte</a></div><div class="gallery"></div></main>
<script type="module">
import * as painted from '../js/world-painted.js?v=2';
const base=new URL('../../',location.href).pathname.replace(/\/$/,'');
await painted.init(base,()=>{});
let working=true,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ids=[['gold','Goldmine'],['quarry','Steinbruch'],['lumber','Holzfäller'],['farm','Kornfarm'],['crystal','Kristallmine']];
const entries=ids.map(([id,name],i)=>{
 const target={kind:'nodes',id:i,resource:{art:id},data:{gatherer_march_id:1}};
 const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><div class="stage"><div class="marker"><img alt="${name}"></div></div><div class="status">Sammelt</div>`;
 document.querySelector('.gallery').append(article);const marker=article.querySelector('.marker');marker.querySelector('img').src=painted.source(target);painted.bind(marker,target);
 return{target,marker,article};
});
document.querySelector('#work').onclick=e=>{working=!working;e.currentTarget.setAttribute('aria-pressed',String(working));e.currentTarget.textContent=working?'Sammelt':'Frei';for(const {target,article}of entries){target.data.gatherer_march_id=working?1:null;article.querySelector('.status').textContent=working?'Sammelt':'Frei – keine Arbeitsanimation';}};
const motion=document.querySelector('#motion');motion.setAttribute('aria-pressed',String(reduced));motion.onclick=()=>{reduced=!reduced;motion.setAttribute('aria-pressed',String(reduced));};
let last=0;function frame(t){requestAnimationFrame(frame);if(document.hidden||t-last<1000/24)return;last=t;for(const {target,marker}of entries)painted.draw(marker,target,t/1000,reduced);}requestAnimationFrame(frame);
</script>
</html>
