<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5c4270"><title>Conquer · Offline</title><link rel="stylesheet" href="assets/css/fantasy-fonts.css"><style>*{box-sizing:border-box}:root{--ui-primary:#5c4270;--ui-paper:#e9dfcf;--ui-card:#fbf6ec;--ui-inset:#dfcda9;--ui-line:#c7b692;--ui-frame:#756080;--ui-ink:#443549;--ui-muted:#5f5261;--ui-gold:#c5a361;--ui-green:#586d50;--ui-green-dark:#3f523a;--ui-font:'Conquer UI','Almendra',Georgia,serif}html{background:var(--ui-paper);color:var(--ui-ink);font:17px/1.6 var(--ui-font)}body{min-height:100dvh;display:grid;place-content:center;margin:0;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:linear-gradient(160deg,var(--ui-paper),var(--ui-inset))}main{width:min(480px,100%);background:var(--ui-card);border:3px solid var(--ui-frame);border-radius:20px;padding:clamp(22px,7vw,32px);box-shadow:0 4px 0 #4435492b,0 16px 38px #4435492e}.emblem{font-size:64px;line-height:1;color:var(--ui-gold)}h1{font-size:clamp(25px,8vw,32px);line-height:1.2;margin:.7rem 0}p{margin:0 0 1.5rem}button{min-height:48px;border:1px solid var(--ui-green-dark);border-radius:10px;background:var(--ui-green);color:#fffcf6;font:700 17px var(--ui-font);padding:12px 20px;cursor:pointer;box-shadow:0 3px var(--ui-green-dark)}button:focus-visible{outline:3px solid var(--ui-primary);outline-offset:3px}small{display:block;margin-top:20px;color:var(--ui-muted)}@media(max-width:360px){body{padding:12px}main{padding:20px}.emblem{font-size:52px}}</style></head><body><main><span class="emblem" aria-hidden="true">♜</span><h1 id="title">Dein Königreich ist kurz außer Reichweite.</h1><p id="description">Verbinde dich mit dem Internet, um weiterzuspielen. Dein Fortschritt bleibt auf dem Server gespeichert.</p><button id="retry" type="button">Erneut verbinden</button><small id="note">Diese Offline-Seite enthält keine Konto- oder Spieldaten.</small></main><script>(()=>{const texts={de:['Dein Königreich ist kurz außer Reichweite.','Verbinde dich mit dem Internet, um weiterzuspielen. Dein Fortschritt bleibt auf dem Server gespeichert.','Erneut verbinden','Diese Offline-Seite enthält keine Konto- oder Spieldaten.'],fr:['Votre royaume est momentanément inaccessible.','Connectez-vous à Internet pour continuer à jouer. Votre progression reste enregistrée sur le serveur.','Réessayer','Cette page hors ligne ne contient aucune donnée de compte ou de jeu.'],lb:['Däi Kinnekräich ass kuerz net erreechbar.','Verbann dech mam Internet, fir weiderzespillen. Däi Fortschrëtt bleift um Server gespäichert.','Nach eng Kéier verbannen','Dës Offline-Säit enthält keng Konto- oder Spilldaten.']};let locale='de';try{locale=localStorage.getItem('conquer.locale')||'de';}catch{}if(locale==='lu')locale='lb';if(!texts[locale])locale='de';document.documentElement.lang=locale;['title','description','retry','note'].forEach((id,i)=>document.getElementById(id).textContent=texts[locale][i]);document.getElementById('retry').addEventListener('click',()=>location.reload());})();</script></body></html>
